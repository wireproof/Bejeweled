name: Source checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/check_source.py
      - run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic blitz-core/test_boost_core.cpp -o /tmp/bejeweled-boost-test
      - run: /tmp/bejeweled-boost-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic blitz-core/test_boost_runtime.cpp -o /tmp/bejeweled-runtime-test
      - run: /tmp/bejeweled-runtime-test
